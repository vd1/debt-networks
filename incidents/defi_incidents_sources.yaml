# DeFi incident research — canonical source index
# Built from the Oct 2025 → Apr 2026 sweep. Use this as the starting
# point for future searches. Grouped by what each source is best for.

meta:
  compiled: 2026-04-22
  last_spot_update: 2026-07-06
  window: 2025-10-01 to 2026-07-06
  companion_file: defi_incidents_2025-10_to_2026-04.md

# --- Primary incident trackers (check these first) ------------------

trackers:
  - name: rekt.news
    url: https://rekt.news/
    leaderboard: https://rekt.news/leaderboard
    notes: Deep postmortems on >$1M incidents. Individual posts at /<protocol>-rekt.
    search_hint: "site:rekt.news <protocol>"

  - name: DefiLlama Hacks
    url: https://defillama.com/hacks
    notes: Structured DB of DeFi exploits with dates, amounts, vectors. Best
      cross-check for "did incident X actually happen" and for the $500K–$10M
      long tail that news misses.

  - name: PeckShield (X alerts + monthly recaps)
    url: https://x.com/PeckShieldAlert
    notes: Real-time on-chain exploit detection. Monthly recap tweets are
      the best single monthly index. Search "PeckShield monthly <month> <year>".

  - name: BlockSec Phalcon (X alerts + Phalcon Explorer)
    url: https://x.com/Phalcon_xyz
    explorer: https://app.blocksec.com/phalcon/explorer
    notes: Real-time exploit alerts plus transaction traces. Good for same-day
      root-cause hypotheses before full BlockSec postmortems are published.

  - name: SlowMist Hacked
    url: https://hacked.slowmist.io/
    notes: Another structured incident DB; good cross-check on PeckShield.

  - name: ZachXBT
    url: https://x.com/zachxbt
    notes: On-chain investigator. Best for exchange/wallet-drain incidents,
      team complicity allegations, laundering traces.

# --- Audit / security firm monthly reviews (index style) ------------

monthly_reviews:
  - name: Halborn — "Top DeFi Hacks of <Month> <Year>"
    url_pattern: https://www.halborn.com/blog/post/month-in-review-top-defi-hacks-of-<month>-<year>
    example: https://www.halborn.com/blog/post/month-in-review-top-defi-hacks-of-february-2026
    notes: Single best "what happened this month" summary. Hit monthly.

  - name: QuillAudits hack analyses
    url_pattern: https://www.quillaudits.com/blog/hack-analysis/<protocol>-exploit-explained
    twitter: https://x.com/QuillAudits_AI

  - name: BlockSec incident analyses
    url_pattern: https://blocksec.com/blog/<slug>
    notes: Deep technical postmortems, especially on multisig / durable-nonce
      / cross-chain incidents.

  - name: Check Point Research
    url_pattern: https://research.checkpoint.com/<year>/<slug>
    notes: Rounding-error and low-level bug analyses (Balancer, "16 wei").

  - name: Three Sigma Exploits
    url_pattern: https://threesigma.xyz/blog/exploit/<slug>

  - name: Chainalysis / TRM Labs
    urls:
      - https://www.chainalysis.com/blog/
      - https://www.trmlabs.com/resources/blog
    notes: State-actor attribution (Lazarus, UNC1069) and laundering analysis.

  - name: Blockaid
    url: https://www.blockaid.io/blog
    notes: Key-compromise and frontend-attack analyses.

  - name: OpenZeppelin
    url: https://www.openzeppelin.com/news
    notes: Postmortems especially when OZ contracts/forks are involved.

  - name: Olympix AI
    url: https://olympixai.medium.com/
    notes: Deep dives on specific exploits (e.g. 1inch Fusion v1).

